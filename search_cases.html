<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Cases - FIR Portal</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
      background-image: url('https://i.pinimg.com/550x/a4/cb/8f/a4cb8f31f0375718e7ee6a994da9fbab.jpg'); /* Set your image path here */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: fadeInBackground 3s ease-in-out forwards;
    }

    @keyframes fadeInBackground {
      0% {
        opacity: 0;
      }
      100% {
        opacity: 1;
      }
    }

    .container {
      max-width: 500px;
      width: 100%;
      padding: 40px;
      background: rgba(255, 255, 255, 0.3); /* Slight transparency */
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }

    form {
      display: flex;
      flex-direction: column;
    }

    label {
      margin: 10px 0 5px;
      font-weight: bold;
      color: #333;
    }

    input {
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background-color: #0056b3;
    }

    #results {
      margin-top: 20px;
    }

    .result-item {
      background: #fff;
      margin: 10px 0;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    .result-item h3 {
      margin-top: 0;
      color: #007bff;
    }

    .result-item p {
      margin: 5px 0;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Search Cases</h2>
    <form id="searchForm">
      <label for="phone">Mobile Number</label>
      <input type="text" id="phone" name="phone" placeholder="Enter Mobile Number" required>

      <button type="submit">Search</button>
    </form>

    <div id="results">
      <!-- Results will be dynamically inserted here -->
    </div>
  </div>

  <script src="search_cases.js"></script>
</body>
</html>

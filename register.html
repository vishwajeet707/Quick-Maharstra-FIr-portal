<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Registration - FIR Portal</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-image: url("https://t3.ftcdn.net/jpg/03/99/24/82/360_F_399248286_Ogm0T8CFeauN4Hdn42FqWfsCE02dJBbX.jpg"); /* Change this to your image path */
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        background-repeat: no-repeat;
        margin: 0;
        padding: 0;
        animation: fadeInBackground 3s ease-in-out forwards;
      }

      @keyframes fadeInBackground {
        0% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }

      .register-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      .card {
        width: 100%;
        max-width: 600px;
        padding: 20px;
        background-color: rgba(255, 255, 255, 0.3); /* Semi-transparent */
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        box-sizing: border-box;
        backdrop-filter: blur(10px); /* Adds a blur effect */
      }

      .form-title {
        text-align: center;
        margin-bottom: 20px;
        color: #63788f;
        font-weight: bold;
      }

      .form-label {
        font-weight: bold;
        color: #333;
        margin-bottom: 8px;
        display: block;
      }

      .form-control {
        width: 100%;
        padding: 12px;
        border-radius: 4px;
        border: 1px solid #ccc;
        margin-bottom: 16px;
        box-sizing: border-box;
      }

      .form-control:focus {
        border-color: #007bff;
        outline: none;
      }

      .btn-primary {
        width: 100%;
        padding: 12px;
        background-color: #007bff;
        color: white;
        font-size: 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        transition: background-color 0.3s;
      }

      .btn-primary:hover {
        background-color: #000000;
      }

      /* Footer */
      footer {
        background-color: #dd2476;
        color: rgb(3, 0, 0);
        text-align: center;
        padding: 10px 0;
        margin-top: 20px;
      }

      footer a {
        color: #fffefe;
        text-decoration: none;
      }

      footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="register-container">
      <div class="card">
        <h2 class="form-title">User Registration</h2>
        <form
          action="submit_registration.php"
          method="post"
          enctype="multipart/form-data"
        >
          <div>
            <label for="fullName" class="form-label">Full Name</label>
            <input
              type="text"
              class="form-control"
              id="fullName"
              name="fullName"
              placeholder="Enter your full name"
              required
            />
          </div>
          <div>
            <label for="email" class="form-label">Email Address</label>
            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              placeholder="Enter your email"
              required
            />
          </div>
          <div>
            <label for="phone" class="form-label">Phone Number</label>
            <input
              type="tel"
              class="form-control"
              id="phone"
              name="phone"
              placeholder="Enter your phone number"
              required
            />
          </div>
          <div>
            <label for="address" class="form-label">Address</label>
            <textarea
              class="form-control"
              id="address"
              name="address"
              rows="3"
              placeholder="Enter your address"
              required
            ></textarea>
          </div>

          <div>
            <label for="aadhar" class="form-label">Aadhar Card Number</label>
            <input
              type="text"
              class="form-control"
              id="aadhar"
              name="aadhar"
              placeholder="Enter your Aadhar number"
              required
            />
          </div>
          <div>
            <label for="pan" class="form-label">PAN Card Number</label>
            <input
              type="text"
              class="form-control"
              id="pan"
              name="pan"
              placeholder="Enter your PAN number"
              required
            />
          </div>
          <div>
            <label for="photo" class="form-label">Upload Aadhar Card</label>
            <input
              type="file"
              class="form-control"
              id="photo"
              name="photo"
              accept="image/*"
              required
            />
          </div>

          <div>
            <label for="username" class="form-label">Username</label>
            <input
              type="text"
              class="form-control"
              id="username"
              name="username"
              placeholder="Choose a username"
              required
            />
          </div>
          <div>
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              class="form-control"
              id="password"
              name="password"
              placeholder="Create a password"
              required
            />
          </div>
          <div>
            <label for="confirmPassword" class="form-label"
              >Confirm Password</label
            >
            <input
              type="password"
              class="form-control"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Re-enter your password"
              required
            />
          </div>

          <div>
            <button type="submit" class="btn-primary">Register</button>
          </div>
        </form>
        <hr />
        <div
          class="footer"
          style="text-align: center; margin-top: 20px; font-size: 16px"
        >
          Already have an account?
          <a
            href="login.html"
            style="font-weight: bold; color: blue; text-decoration: none"
            >Login here</a
          >.
        </div>
      </div>
    </div>
    <script src="regi_log.js"></script>
    <footer>
      &copy; 2025 MH FIR Portal. All Rights Reserved. |

      <a href="./faq.html">FAQ</a> |
      <a href="./contact.html">Contact Us</a>
    </footer>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Officer Allotment - Admin</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: url("https://i.pinimg.com/550x/a4/cb/8f/a4cb8f31f0375718e7ee6a994da9fbab.jpg") no-repeat center center fixed;
        background-size: cover;
        animation: fadeInBackground 3s ease-in-out forwards;
      }

      @keyframes fadeInBackground {
        0% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }

      .container {
        margin-top: 50px;
      }

      .card {
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: #333;
      }

      .card-header {
        font-size: 1.2rem;
        font-weight: bold;
      }

      .form-select,
      .btn {
        font-weight: bold;
      }

      .table-container {
        margin-top: 30px;
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(10px);
        padding: 20px;
        border-radius: 10px;
      }

      .table {
        background: rgba(255, 255, 255, 0.8);
      }

      h2,
      h3 {
        color: white;
        text-align: center;
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2 class="text-white text-center">Allot Officer for FIR</h2>

      <div class="card mt-4">
        <div class="card-header">Pending FIRs</div>
        <div class="card-body">
          <form id="allotOfficerForm">
            <div class="mb-3">
              <label for="firSelect" class="form-label">Select FIR</label>
              <select id="firSelect" class="form-select">
                <option value="">Select FIR</option>
                <!-- FIR options will be dynamically added -->
              </select>
            </div>

            <div class="mb-3">
              <label for="officerSelect" class="form-label"
                >Select Officer</label
              >
              <select id="officerSelect" class="form-select">
                <option value="">Select Officer</option>
                <!-- Officer options will be dynamically added -->
              </select>
            </div>

            <button type="submit" class="btn btn-primary">Allot Officer</button>
          </form>
        </div>
      </div>

      <!-- Table to Display Allotted Officers -->
      <div class="table-container">
        <h3>Allotted Officers and FIR Cases</h3>
        <table class="table table-bordered table-striped">
          <thead class="table-dark">
            <tr>
              <th>#</th>
              <th>FIR ID</th>
              <th>Case Title</th>
              <th>Officer Name</th>
              <th>Badge Number</th>
            </tr>
          </thead>
          <tbody id="allotmentTableBody">
            <!-- Data will be injected here -->
          </tbody>
        </table>
      </div>

      <button id="logout" class="btn btn-danger mt-3">Logout</button>
    </div>

    <script src="./allot_officer.js"></script>
  </body>
</html>

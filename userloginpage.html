<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Dashboard</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <style>
    body {
      margin: 0;
      padding: 0;
      position: relative;
      background: url('./assets/mhp.jpg') no-repeat center center fixed;
      background-size: auto;
      animation: fadeInBackground 3s ease-in-out forwards;
    }

    @keyframes fadeInBackground {
      0% {
        opacity: 0;
      }
      100% {
        opacity: 1;
      }
    }

    /* Faded Overlay Effect */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.3); /* Light fade effect */
      z-index: -1;
    }

    .container {
      position: relative;
      z-index: 1;
    }

    /* Transparent Form with Frosted Glass Effect */
    .card {
      background: rgba(255, 255, 255, 0.2); /* Transparent background */
      backdrop-filter: blur(10px); /* Frosted glass effect */
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .card-header, .card-body {
      color: #333; /* Dark text for contrast */
    }

    .btn {
      font-weight: bold;
    }
  </style>

</head>
<body>
  <div class="container mt-5">
    <div class="card">
      <div class="card-header">
        Welcome, <span id="greetusername">User</span>!
      </div>
      <div class="card-body">
        <h5 class="card-title">File a New FIR</h5>
        <form id="fileFirForm">
          <div class="mb-3">
            <label for="firTitle" class="form-label">Title</label>
            <input type="text" id="firTitle" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="firLocation" class="form-label">Location</label>
            <input type="text" id="firLocation" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="firDetails" class="form-label">Details</label>
            <textarea id="firDetails" class="form-control" rows="3" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Submit FIR</button>
        </form>
      </div>
    </div>

    <div class="card mt-4">
      <div class="card-header">
        Your Filed FIRs
      </div>
      <div class="card-body">
        <div class="mb-3">
          <input type="text" id="search" class="form-control" placeholder="Search by Name, Date, or Location">
        </div>
        <ul id="firList" class="list-group"></ul>
      </div>
    </div>

    <button id="logout" class="btn btn-danger mt-3">Logout</button>
  </div>

  <script src="./userloginpage.js"></script>
</body>
</html>

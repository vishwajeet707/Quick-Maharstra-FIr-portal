<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
    <style>
        /* Global Styles */
        body {
            font-family: 'Arial', sans-serif;
            background: url('https://i.pinimg.com/550x/a4/cb/8f/a4cb8f31f0375718e7ee6a994da9fbab.jpg') no-repeat center center fixed; /* Background Image */
            background-size: cover;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Main Container */
        div {
            width: 80%; /* Adjusted width to enlarge */
            max-width: 1000px; /* Increased max width */
            background: rgba(255, 255, 255, 0.4); /* Semi-transparent background */
            padding: 30px; /* Increased padding */
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            margin-top: 20px;
        }

        /* Heading */
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        /* Form Styles */
        form {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-top: 10px;
        }

        input {
            padding: 10px; /* Increased padding for better look */
            margin: 10px 0 15px; /* Adjusted margin */
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 100%;
        }

        button {
            background-color: #007bff;
            color: #fff;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 15px;
        }

        button:hover {
            background-color: #0056b3;
        }

        /* Status Messages */
        #status, #usernameError, #emailError {
            color: red;
            font-size: 14px;
            margin-top: 5px;
        }

        /* Search Input */
        #search {
            width: 100%;
            padding: 10px; /* Increased padding */
            margin-top: 25px; /* Adjusted margin */
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        /* Table Styles */
        table {
            width: 100%;
            margin-top: 25px;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px; /* Increased padding */
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #007bff;
            color: white;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        /* Actions Buttons */
        .edit-btn, .delete-btn {
            padding: 5px 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .edit-btn {
            background-color: #28a745;
            color: white;
        }

        .delete-btn {
            background-color: #dc3545;
            color: white;
        }

        .edit-btn:hover {
            background-color: #218838;
        }

        .delete-btn:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>
    <div>
        <h2>User Management</h2>
        <form id="userForm">
            <label for="fullName">Full Name:</label>
            <input type="text" id="fullName" name="fullName" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">Phone:</label>
            <input type="text" id="phone" name="phone" required>

            <label for="address">Address:</label>
            <input type="text" id="address" name="address" required>

            <label for="aadhar">Aadhar:</label>
            <input type="text" id="aadhar" name="aadhar" required>

            <label for="pan">PAN:</label>
            <input type="text" id="pan" name="pan" required>

            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>

            <span id="usernameError"></span>
            <span id="emailError"></span>

            <button type="button" onclick="addOrUpdateUser()">Submit</button>
            <span id="status"></span>
        </form>

        <input type="text" id="search" onkeyup="searchUsers()" placeholder="Search by Username">

        <table id="userTable">
            <thead>
                <tr>
                    <th>Full Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Address</th>
                    <th>Aadhar</th>
                    <th>PAN</th>
                    <th>Username</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="userList"></tbody>
        </table>
    </div>

    <script src="manage_users.js"></script>
</body>
</html>

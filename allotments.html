<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Officer Allotments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            background: url('./assets/mhp.jpg') no-repeat center center fixed;
            background-size: cover;
        }

        .container {
            margin-top: 50px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 10px;
        }

        .table {
            background: rgba(255, 255, 255, 0.8);
        }

        h2 {
            color: white;
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Allotted Officers and FIR Cases</h2>
        <table class="table table-bordered table-striped">
            <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>FIR ID</th>
                    <th>Case Title</th>
                    <th>Officer Name</th>
                    <th>Badge Number</th>
                </tr>
            </thead>
            <tbody id="allotmentTableBody">
            </tbody>
        </table>
    </div>

    <script src="./allotments.js"></script>
</body>
</html>
